<script>
var U = window.MelodiaAuth.guard();
/* Chaque console renvoyait vers l'autre quand le rôle ne lui convenait
   pas : deux pages qui se renvoient mutuellement font boucler le
   navigateur dès qu'elles ne s'accordent pas — ce qui arrive dès que
   l'une tourne sur une version de auth.js gardée en cache et l'autre
   non. orienter() relit le rôle dans la base, qui seule fait autorité,
   et ne s'autorise qu'un seul saut par chargement. U est posé tout de
   suite pour que la page démarre, puis rafraîchi si l'on reste. */
window.MelodiaAuth.orienter('master').then(function (u) { if (u) U = u; });

function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;}
function eur(n){return (n||0).toLocaleString('fr-FR')+' €';}
function logout(){window.MelodiaAuth.logout();location.href='compte.html';}

var ORDERS = [], PARTNERS = [], FLOW = window.MELODIA_FLOW, ST = window.MELODIA_STATUS;
var AI = { title:'', lyrics:'', style:'' };

/* Rechargement des commandes depuis la base, appelé après une écriture
   faite ailleurs (rattachement d'un hommage par l'atelier) : sans cela,
   les fiches continuent d'afficher la copie chargée au démarrage. */
window.MELODIA_REFRESH = async function () {
  ORDERS = await window.MelodiaDB.all();
  return ORDERS;
};

/* Une base injoignable — réseau coupé, projet en pause — faisait
   échouer boot() sur un rejet non capté : la console restait sur un
   écran vide, sans un mot. Elle démarre désormais quand même, sur des
   listes vides et avec un avertissement : le mode propriétaire, lui,
   travaille sur un brouillon local et n'a pas besoin du réseau. */
async function boot() {
  var panne = null;
  try {
    await window.MelodiaDB.seedIfEmpty();
    ORDERS = await window.MelodiaDB.all();
    PARTNERS = await window.MelodiaDB.partners();
  } catch (e) {
    ORDERS = ORDERS || []; PARTNERS = PARTNERS || []; panne = e;
  }
  if (panne) {
    var av = document.getElementById('view');
    if (av) av.insertAdjacentHTML('beforebegin',
      '<div class="form-msg err" style="display:block; margin-top:1rem;">Base de données injoignable : les commandes et les agences ne sont pas chargées. ' +
      'Le mode propriétaire reste utilisable ; la publication attendra le retour du réseau.</div>');
  }
  document.getElementById('badge-cmd').textContent = ORDERS.length;
  /* L'en-tête annonçait « Base Supabase » du seul fait que l'adresse
     de la base est configurée — même quand la console tourne sur une
     session locale que la base ne reconnaît pas. Il dit maintenant ce
     qui est vrai du point de vue des données. */
  var badge = document.getElementById('mode-badge');
  var avecSession = window.MelodiaRest && window.MelodiaRest.session();
  if (window.MelodiaDB.mode === 'supabase' && !avecSession) {
    badge.textContent = 'Session locale · la base ne vous reconnaît pas';
    badge.style.color = 'var(--amber)';
    badge.style.borderColor = 'rgba(251,191,36,.35)';
    badge.title = 'Reconnectez-vous avec votre compte pour retrouver vos données.';
  } else {
    badge.textContent = (window.MelodiaDB.mode === 'supabase' ? 'Base Supabase · ' : 'Base locale · ') + 'mode débutant';
  }
  go('accueil');
  /* Le compteur de messages doit vivre dès l'ouverture de la console :
     sans cela, on ne sait qu'on a du courrier qu'en cliquant dessus. */
  if (window.MelodiaIntranet) {
    if (window.MelodiaIntranet.majBadgeMessages) window.MelodiaIntranet.majBadgeMessages();
    if (window.MelodiaIntranet.majBadgeCandidatures) window.MelodiaIntranet.majBadgeCandidatures();
    if (window.MelodiaIntranet.majBadgeDemandes) window.MelodiaIntranet.majBadgeDemandes();
    if (window.MelodiaIntranet.majBadgePilotage) window.MelodiaIntranet.majBadgePilotage();
    /* Les réglages arrivent une fois pour toute la session : les écrans
       qui les lisent (finances, pilotage) les trouvent déjà là. */
    if (window.MelodiaIntranet.reglages) window.MelodiaIntranet.reglages.charger();
  }
}

document.querySelectorAll('.side-item').forEach(function(b){
  b.addEventListener('click', function(){ go(b.dataset.v); document.getElementById('side').classList.remove('open'); });
});

function go(v) {
  document.querySelectorAll('.side-item').forEach(function(b){ b.classList.toggle('active', b.dataset.v === v); });
  var H = {
    accueil: ['Console maître', 'Vue <em>générale</em>'],
    commandes: ['Production', 'Toutes les <em>commandes</em>'],
    atelier: ['Hyper AI Engine', 'Atelier de <em>composition</em>'],
    partenaires: ['Réseau', 'Agences <em>partenaires</em>'],
    finances: ['Comptabilité', 'Vue <em>financière</em>'],
    prospection: ['Croissance', 'Plan de <em>prospection</em>'],
    proprietaire: ['Contrôle total', 'Mode <em>propriétaire</em>'],
    agenda: ['Organisation', 'L\'<em>agenda</em>'],
    messagerie: ['Équipe', 'La <em>messagerie</em>'],
    catalogue: ['Le fonds', 'Le <em>catalogue</em>'],
    social: ['Croissance', 'Réseaux <em>sociaux</em>'],
    candidatures: ['Recrutement', 'Les <em>candidatures</em>'],
    pilotage: ['Poste de pilotage', 'Ce qui <em>appelle une action</em>'],
    demandes: ['Familles', 'Les <em>demandes</em>'],
    reglages: ['Configuration', 'Les <em>réglages</em>'],
    plaques: ['Souvenir', 'Les <em>plaques</em> à QR code'],
    systeme: ['Configuration', 'Le <em>système</em>'],
    adieux: ['Un mot pour toi', 'Les <em>adieux</em>']
  }[v];
  /* Une vue sans titre déclaré faisait planter « go() » sur H[0] avant
     même d'afficher quoi que ce soit : l'écran restait sur le précédent
     sans rien dire. Un repli vaut mieux qu'une page morte. */
  if (!H) H = ['Console', v.charAt(0).toUpperCase() + v.slice(1)];
  document.getElementById('head-eyebrow').textContent = H[0];
  document.getElementById('head-title').innerHTML = H[1];
  var INTRA = { agenda: 'agenda', messagerie: 'messagerie', catalogue: 'catalogue',
                social: 'publications', candidatures: 'candidatures',
                pilotage: 'pilotage', demandes: 'demandes', reglages: 'reglages' };
  if (INTRA[v]) {
    document.getElementById('view').innerHTML = '<div id="intra-root"></div>';
    if (window.MelodiaIntranet) window.MelodiaIntranet.vues[INTRA[v]](document.getElementById('intra-root'));
    else document.getElementById('intra-root').innerHTML =
      '<div class="form-msg err" style="display:block;">Le module intranet ne s\'est pas chargé.</div>';
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  if (v === 'plaques') {
    document.getElementById('view').innerHTML = '<div id="mem-root"></div>';
    if (window.MelodiaMemorial) window.MelodiaMemorial.panneau(document.getElementById('mem-root'), { peutSupprimer: true });
    else document.getElementById('mem-root').innerHTML =
      '<div class="form-msg err" style="display:block;">Le module des plaques ne s\'est pas chargé.</div>';
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  document.getElementById('view').innerHTML = ({ accueil:vAccueil, commandes:vCommandes, atelier:vAtelier, partenaires:vPartenaires, finances:vFinances, prospection:vProspection, proprietaire:vProprietaire, systeme:vSysteme, adieux:vAdieux })[v]();
  if (v === 'atelier') restoreAtelier();
  if (v === 'adieux') chargerAdieux();
  if (v === 'proprietaire' && window.MelodiaOwner) window.MelodiaOwner.mount();
  if (v === 'systeme') { majEtatMusique(); majEtatCourriel(); if (window.MelodiaMotDePasse) window.MelodiaMotDePasse.brancher(); }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function timeline(s) {
  var i = FLOW.indexOf(s);
  return '<div class="tl">' + FLOW.map(function(x,k){
    var c = k < i ? 'done' : (k === i ? (x === 'livree' ? 'done' : 'now') : '');
    return '<div class="tl-s ' + c + '"><div class="tl-dot"></div><div class="tl-lab">' + ST[x].label + '</div></div>';
  }).join('') + '</div>';
}

function orderCard(o) {
  var m = ST[o.status] || { label:o.status, color:'#888' };
  var i = FLOW.indexOf(o.status);
  var next = i < FLOW.length - 1 ? FLOW[i+1] : null;
  var ech = echeanceDe(o);
  /* L'or plein est réservé à ce qui presse. Sur une liste ordinaire il
     n'y en a aucun, et c'est voulu : quand il apparaît, il se voit. */
  var presse = !!(o.urgence || (ech && ech.c === 'retard'));
  return '<div class="o-row' + (presse ? ' o-presse' : '') + '"><div class="o-head">' +
    '<div><div class="o-name">Hommage à ' + esc(o.defunt) + (o.urgence ? ' ⚡' : '') + '</div>' +
    '<div class="o-meta">' + esc(o.ref) + ' · ' + esc(o.offer) + ' ' + eur(o.price) + ' · ' + mentionPaiement(o) + ' · ' + esc(o.agence || o.user_name) + '</div>' +
    (ech ? '<div class="o-quand ' + ech.c + '">' + ech.t + '</div>' : '') + '</div>' +
    '<div style="display:flex; gap:0.7rem; align-items:center; flex-wrap:wrap;">' +
    '<span class="pill pill-etat" style="color:' + m.color + ';">' + m.label + '</span>' +
    (next ? '<button class="btn ' + (presse ? 'btn-gold' : 'btn-outline') + ' btn-sm" onclick="advance(\'' + o.ref + '\',\'' + next + '\')">→ ' + ST[next].label + '</button>' : '') +
    '<button class="btn btn-outline btn-sm" onclick="loadBrief(\'' + esc(o.ref) + '\')">Composer</button>' +
    '</div></div>' + timeline(o.status) +
    /* Le brief en colonnes : chaque champ sous son étiquette. En une
       seule phrase courante, retrouver le métier demandait de relire
       la ligne entière. */
    '<div class="o-faits">' +
    fait('Style', o.style) + fait('Traits', o.traits) +
    fait('Métier', o.metier) + fait('Habitude', o.habitude) +
    fait('Contact', [o.user_name, o.user_email].filter(Boolean).join(' · ')) +
    (o.anecdote ? fait('Anecdote', o.anecdote) : '') +
    '</div>' +
    (o.audio_url ? '<div style="margin-top:.9rem; padding-top:.9rem; border-top:1px solid var(--line-soft);">' + '<div class="mono" style="margin-bottom:.5rem; color:var(--or-patina);">Hommage attaché' + (o.audio_title ? ' — ' + esc(o.audio_title) : '') + '</div>' + (/^local:/.test(o.audio_url)
       ? '<span class="pill" style="color:var(--amber); border-color:rgba(251,191,36,.35);">Fichier sur l\'appareil du fondateur</span>'
       : /\.(mp3|m4a|wav|ogg|flac)(\?|#|$)/i.test(o.audio_url)    ? '<audio controls preload="none" style="width:100%;" src="' + esc(o.audio_url) + '"></audio>'    : '<a class="btn btn-outline btn-sm" href="' + esc(o.audio_url) + '" target="_blank" rel="noopener">Ouvrir l\'hommage</a>') + '</div>' : '') +
    '</div>';
}

async function advance(ref, status) {
  var o = ORDERS.filter(function (x) { return x.ref === ref; })[0];
  await window.MelodiaDB.setStatus(ref, status);

  /* Le statut changeait dans la base et la famille n'en savait rien :
     elle voyait l'avancement seulement si elle pensait à se connecter.
     Chaque passage d'étape lui écrit maintenant — la livraison surtout,
     qui porte le lien d'écoute et l'invitation à demander une révision. */
  var envoi = Promise.resolve({ ok: false, code: 'NO_ORDER' });
  if (o && o.user_email && window.MelodiaCourrier) {
    envoi = window.MelodiaCourrier.etape(status, {
      email: o.user_email, nom: o.user_name, defunt: o.defunt,
      ref: o.ref, offre: o.offer, urgence: !!o.urgence,
      lien: /^https:\/\//i.test(o.audio_url || '') ? o.audio_url : ''
    });
  }

  ORDERS = await window.MelodiaDB.all();
  go('commandes');

  var r = await envoi;
  if (r.ok) {
    window.melodiaToast('Statut mis à jour — ' + (o.user_email) + ' vient d\'être prévenu par courriel.');
  } else if (status === 'livree') {
    /* Une livraison muette est un incident : la famille attend un
       courriel, pas une connexion au tableau de bord. */
    window.melodiaToast('Statut mis à jour, mais le courriel de livraison n\'est PAS parti (' + r.code + '). Prévenez la famille à la main.');
  } else {
    window.melodiaToast('Statut mis à jour — le client le voit immédiatement.');
  }
}

function loadBrief(ref) {
  var o = ORDERS.filter(function (x) { return x.ref === ref; })[0];
  if (!o) { window.melodiaToast('Commande introuvable.'); return; }
  window.MELODIA_ATELIER_REF = o.ref;   /* cible du rattachement de l'audio */
  go('atelier');
  setTimeout(function(){
    ['defunt','traits','metier','habitude','anecdote'].forEach(function(k){
      var el = document.getElementById('at-' + k); if (el) el.value = o[k] || '';
    });
    var s = document.getElementById('at-style'); if (s && o.style) s.value = o.style;
    window.melodiaToast('Brief de ' + o.defunt + ' chargé dans l\'atelier.');
  }, 60);
}

/* Interroge le serveur : la composition automatique est-elle branchée ? */
async function majEtatMusique() {
  var c = document.getElementById('sys-music');
  if (!c) return;
  try {
    var cfg = await window.MelodiaAI.musicConfig();
    c.innerHTML = cfg.configured
      ? '<span style="color:var(--green);">API ' + esc(cfg.engine || 'Mureka') + ' active</span> — ' + esc(cfg.provider) + ' · ' + esc(cfg.model)
      : '<span style="color:var(--or);">Manuelle</span> — Suno, votre abonnement';
  } catch (e) { c.textContent = 'Indéterminé'; }
}

/* ─── L'encaissement ───
   Trois modes possibles, et la console doit dire lequel tourne
   réellement : afficher « bac à sable » quand l'argent arrive
   vraiment, ou l'inverse, est la pire des confusions ici. */
function etatPaiement() {
  var c = window.MELODIA_CONFIG || {};
  if ((c.PAYPAL_CLIENT_ID || '').trim()) {
    return '<span style="color:var(--green);">PayPal — encaissement automatique</span>';
  }
  if (c.PAYPAL_ME) {
    return '<span style="color:var(--amber);">PayPal.me — ' + esc(c.PAYPAL_ME) + '</span>' +
      '<div style="color:var(--dust); font-size:0.82em; margin-top:0.3rem; line-height:1.5;">' +
      'PayPal ne nous répond pas sur ce mode : chaque règlement est à pointer à la main.</div>';
  }
  return '<span style="color:var(--red);">Bac à sable — rien n\'est encaissé</span>';
}

/* « Non payé » et « payé sur un lien, à vérifier » ne demandent pas la
   même chose : relancer une famille qui a déjà réglé serait une faute. */
function mentionPaiement(o) {
  if (o.paid) return '<span style="color:var(--green);">payé</span>';
  if (o.paypal_id === 'paypalme') return '<span style="color:var(--amber);">réglé sur PayPal.me — à pointer</span>';
  return 'non payé';
}

/* ─── L'état de la chaîne d'envoi ───
   Six enregistrements DNS et cinq variables se règlent mal à l'aveugle :
   sans ce panneau, la seule façon de savoir si le courriel fonctionne
   était de passer une vraie commande et d'attendre. */
var LIB_VAR = {
  RESEND_API_KEY: 'Clé Resend',
  COURRIER_FROM: 'Expéditeur des hommages',
  PROSPECT_FROM: 'Expéditeur du démarchage',
  LEAD_TO: 'Boîte de la maison',
  SITE_URL: 'Adresse du site'
};

function ligneEtat(nom, ok, detail) {
  return '<tr><td style="color:var(--ash);">' + esc(nom) + '</td><td>' +
    (ok ? '<span style="color:var(--green);">✓ posée</span>' : '<span style="color:var(--amber);">absente</span>') +
    (detail ? ' <span style="color:var(--dust); font-size:0.85em;">' + esc(detail) + '</span>' : '') +
    '</td></tr>';
}

async function majEtatCourriel() {
  var c = document.getElementById('sys-courriel');
  if (!c) return;
  c.innerHTML = '<span class="status-live" style="display:inline-flex;">Vérification…</span>';
  var e;
  try {
    var r = await fetch('/api/courrier-etat', { headers: { 'Content-Type': 'application/json' } });
    e = await r.json();
    if (!r.ok) throw new Error(e && e.error ? e.error : 'HTTP ' + r.status);
  } catch (err) {
    c.innerHTML = '<div class="form-msg err" style="display:block;">Vérification impossible : ' + esc(err.message) +
      '. Cette page doit tourner sur le vrai site, pas depuis un fichier ouvert localement.</div>';
    return;
  }

  var h = e.pret
    ? '<div class="form-msg ok" style="display:block; margin-bottom:1.2rem;">Le courriel est opérationnel. Les familles reçoivent confirmations et livraisons.</div>'
    : '<div class="form-msg err" style="display:block; margin-bottom:1.2rem;"><b>Aucun courriel ne part encore.</b><br>' +
      e.manque.map(esc).join('<br>') + '</div>';

  h += '<table class="tbl"><tbody>';
  Object.keys(LIB_VAR).forEach(function (k) {
    var det = '';
    if (k === 'COURRIER_FROM' && e.expediteurs.courrier) det = e.expediteurs.courrier;
    if (k === 'PROSPECT_FROM' && e.expediteurs.prospection) det = e.expediteurs.prospection;
    if (k === 'LEAD_TO' && e.maison) det = e.maison + ' destinataire(s)';
    /* Afficher l'adresse de repli en face d'une variable « absente »
       se lit comme une contradiction : on ne montre le détail que
       lorsque la variable est réellement posée. */
    if (k === 'SITE_URL' && e.variables.SITE_URL) det = e.site;
    h += ligneEtat(LIB_VAR[k], e.variables[k], det);
  });
  h += '</tbody></table>';

  if (e.resend && e.resend.lisible) {
    h += '<div class="panel-sub" style="margin:1.4rem 0 0.6rem;">Domaines chez Resend</div><table class="tbl"><tbody>';
    if (!e.resend.domaines.length) {
      h += '<tr><td colspan="2" style="color:var(--amber);">Aucun domaine créé dans votre compte Resend.</td></tr>';
    }
    e.resend.domaines.forEach(function (d) {
      var vert = d.statut === 'verified';
      h += '<tr><td style="color:var(--ash);">' + esc(d.nom) + '</td><td>' +
        '<span style="color:var(--' + (vert ? 'green' : 'amber') + ');">' +
        (vert ? '✓ vérifié' : esc(d.statut)) + '</span>' +
        (d.region ? ' <span style="color:var(--dust); font-size:0.85em;">' + esc(d.region) + '</span>' : '') +
        '</td></tr>';
    });
    h += '</tbody></table>';
  } else if (e.resend && e.resend.motif) {
    h += '<p style="color:var(--ash); font-size:0.85rem; margin-top:1rem;">' + esc(e.resend.motif) + '</p>';
  }

  /* L'essai réel : le seul verdict qui vaille. Il emprunte exactement
     le chemin d'une vraie confirmation de commande. */
  h += '<div class="panel-sub" style="margin:1.6rem 0 0.6rem;">Essai réel</div>' +
       '<p style="color:var(--ash); font-size:0.85rem; line-height:1.7; margin-bottom:0.9rem;">' +
       'Ce bouton emprunte exactement le chemin d\'une vraie confirmation de commande. ' +
       'Essayez d\'abord une adresse Gmail ou Outlook : un courriel qui arrive dans votre propre ' +
       'boîte OVH ne prouve rien sur ce que voient les familles.</p>' +
       '<div style="display:flex; gap:0.8rem; flex-wrap:wrap; align-items:center;">' +
       '<input class="field-input" id="sys-courriel-a" type="email" style="flex:1 1 240px; min-width:0;" ' +
       'value="' + esc((U && U.email) || '') + '" placeholder="vous@gmail.com">' +
       '<button class="btn btn-outline btn-sm" onclick="essaiCourriel()">Envoyer l\'essai</button></div>' +
       '<div id="sys-courriel-essai" style="color:var(--ash); font-size:0.85rem; margin-top:0.8rem;"></div>';

  c.innerHTML = h;
}

async function essaiCourriel() {
  var r = document.getElementById('sys-courriel-essai');
  var champ = document.getElementById('sys-courriel-a');
  var moi = (champ ? champ.value : '').trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(moi)) {
    r.innerHTML = '<span style="color:var(--amber);">Renseignez une adresse valide.</span>'; return;
  }
  r.textContent = 'Envoi à ' + moi + '…';
  try {
    var rep = await fetch('/api/famille', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        type: 'confirmation', email: moi, nom: (U.name || '').split(' ')[0],
        ref: 'ESSAI-' + Date.now().toString(36).toUpperCase().slice(-5),
        defunt: 'un essai de configuration', offre: 'Essai', urgence: false
      })
    });
    var j = await rep.json();
    if (!rep.ok) throw new Error((j && (j.error || j.hint)) || 'HTTP ' + rep.status);
    r.innerHTML = '<span style="color:var(--green);">Parti. Regardez ' + esc(moi) +
      ', et le dossier « indésirables » si rien n\'arrive.</span>';
  } catch (err) {
    r.innerHTML = '<span style="color:var(--red);">Échec : ' + esc(err.message) + '</span>';
  }
}

/* « 1 urgence(s) » : la parenthèse est une facilité de programmeur que
   personne n'écrit à la main. On accorde. */
function pluriel(n, singulier, plurielMot) {
  return n + ' ' + (n > 1 ? plurielMot : singulier);
}

/* L'échéance décide de l'ordre de la journée. Elle était en base et
   nulle part à l'écran. */
function joursAvant(o) {
  if (!o || !o.echeance) return null;
  var reste = new Date(o.echeance).getTime() - Date.now();
  if (isNaN(reste)) return null;
  return Math.ceil(reste / 86400000);
}
function estEnRetard(o) {
  var j = joursAvant(o);
  return o.status !== 'livree' && j !== null && j < 0;
}
function echeanceDe(o) {
  if (o.status === 'livree') return null;
  var j = joursAvant(o);
  if (j === null) return null;
  if (j < 0)   return { t: 'En retard de ' + pluriel(-j, 'jour', 'jours'), c: 'retard' };
  if (j === 0) return { t: 'Échéance aujourd\'hui', c: 'retard' };
  if (j <= 2)  return { t: 'Échéance dans ' + pluriel(j, 'jour', 'jours'), c: 'proche' };
  return { t: 'Échéance dans ' + pluriel(j, 'jour', 'jours'), c: '' };
}

function fait(l, v) {
  return '<div><div class="o-fait-l">' + l + '</div>' +
    '<div class="o-fait-v">' + (v ? esc(v) : '<span style="color:var(--ash);">—</span>') + '</div></div>';
}

function tuile(o) {
  return '<div class="kpi' + (o.phare ? ' kpi-phare' : '') + (o.etat ? ' kpi-' + o.etat : '') + '">' +
    '<div class="kpi-label">' + o.l + '</div>' +
    '<div class="kpi-value">' + o.v + (o.u ? '<span class="u">' + o.u + '</span>' : '') + '</div>' +
    (o.f ? '<div class="kpi-foot">' + o.f + '</div>' : '') + '</div>';
}

/* ═══ UN MOT POUR TOI ═══
   Onze messages déposés et dix-sept lectures dormaient en base sans
   qu'aucun écran ne les montre : le seul moyen de les voir était
   d'interroger la base à la main.

   PAS DE GRAPHIQUE, ET C'EST UN CHOIX.
   Trois pages, dont deux à zéro. Un histogramme de 0, 0 et 11 ne
   montre rien qu'une rangée de chiffres ne montre mieux — et prend
   dix fois la place. Une poignée de nombres de tête se lit en tuiles ;
   le détail par page se lit en tableau. Le jour où il y aura douze
   campagnes et des semaines à comparer, la courbe deviendra le bon
   outil ; pas avant.

   LA BASE NE LAISSE PASSER QUE DES COMPTES.
   « adieux_tableau() » exige d'être connecté ET d'être le fondateur,
   et ne rend que des nombres : aucun texte de message, aucun nom
   d'auteur, aucune adresse de fichier. La table reste fermée. */

var ADIEUX = null;

function vAdieux() {
  if (ADIEUX === null) {
    return '<div class="panel"><div class="panel-title">Un mot <em>pour toi</em></div>' +
      '<div class="panel-sub">Chargement…</div></div>';
  }
  if (!ADIEUX.length) {
    return '<div class="panel"><div class="panel-head"><div>' +
      '<div class="panel-title">Un mot <em>pour toi</em></div>' +
      '<div class="panel-sub">Aucune page de départ</div></div></div>' +
      '<p style="color:var(--ash);">Aucune campagne ouverte pour l’instant.</p></div>';
  }

  var total  = ADIEUX.reduce(function (n, c) { return n + c.messages; }, 0);
  var vues   = ADIEUX.reduce(function (n, c) { return n + c.vues; }, 0);
  var medias = ADIEUX.reduce(function (n, c) { return n + c.avec_media; }, 0);
  var pages  = ADIEUX.filter(function (c) { return c.slug; }).length;
  var servies = ADIEUX.filter(function (c) { return c.slug && c.messages; }).length;
  var dernier = ADIEUX.map(function (c) { return c.dernier; })
                      .filter(Boolean).sort().pop();

  return '<div class="kpi-grid">' +
    tuile({ phare:true, l:'Messages déposés', v:total,
            f: medias ? pluriel(medias, 'avec un média', 'avec un média') : 'Tous en texte' }) +
    tuile({ l:'Lectures', v:vues,
            f: total ? (Math.round(vues / total * 10) / 10) + ' par message' : 'Rien à lire encore',
            etat: vues ? 'calme' : '' }) +
    tuile({ l:'Pages de départ', v:pages,
            f: servies ? pluriel(servies, 'a reçu un mot', 'ont reçu un mot') : 'Aucune n’a servi',
            etat: servies ? 'calme' : 'attention' }) +
    tuile({ l:'Dernier dépôt', v: dernier ? ilYA(dernier) : '—',
            f: dernier ? enDate(dernier) : 'Jamais' }) +
    '</div>' +

    '<div class="panel"><div class="panel-head"><div>' +
    '<div class="panel-title">Par <em>page</em></div>' +
    '<div class="panel-sub">Ce que chacune a recueilli</div></div></div>' +
    '<table class="gr-table">' +
    '<thead><tr><th scope="col">Page</th><th scope="col">Dépôts</th>' +
    '<th scope="col">Dont médias</th><th scope="col">Lectures</th>' +
    '<th scope="col">Dernier dépôt</th></tr></thead><tbody>' +
    ADIEUX.map(ligneAdieux).join('') +
    '</tbody></table></div>' +

    /* Les liens de carte ne vivent que côté fondateur : ce sont eux qui
       ouvrent tous les messages d'un coup. Ils n'ont rien à faire sur
       une page de dépôt, que quinze collègues consultent. */
    (ADIEUX.some(function (c) { return c.jeton_carte; })
      ? '<div class="panel"><div class="panel-head"><div>' +
        '<div class="panel-title">Les <em>cartes</em></div>' +
        '<div class="panel-sub">À remettre à la personne qui part — et à elle seule</div></div></div>' +
        ADIEUX.filter(function (c) { return c.jeton_carte; }).map(function (c) {
          return '<div class="o-row"><div class="o-head">' +
            '<div><div class="o-name">' + esc(c.nom) + '</div>' +
            '<div class="o-meta">' + esc(c.sous_titre || '') + '</div></div>' +
            '<div style="display:flex; gap:0.7rem; flex-wrap:wrap;">' +
            '<a class="btn btn-outline btn-sm" href="/pour/' + esc(c.slug) + '" target="_blank" rel="noopener">Page de dépôt</a>' +
            '<a class="btn btn-outline btn-sm" href="/carte/' + esc(c.jeton_carte) + '" target="_blank" rel="noopener">Sa carte</a>' +
            '</div></div></div>';
        }).join('') + '</div>'
      : '');
}

function ligneAdieux(c) {
  var muet = ' style="color:var(--ash);"';
  return '<tr>' +
    '<td><b style="color:var(--paper);">' + esc(c.nom) + '</b>' +
      (c.slug ? '' : ' <span class="pill pill-etat" style="color:var(--ash);">hors campagne</span>') + '</td>' +
    '<td' + (c.messages ? '' : muet) + '>' + c.messages + '</td>' +
    '<td' + (c.avec_media ? '' : muet) + '>' + c.avec_media + '</td>' +
    '<td' + (c.vues ? '' : muet) + '>' + c.vues + '</td>' +
    '<td' + (c.dernier ? '' : muet) + '>' + (c.dernier ? enDate(c.dernier) : 'aucun') + '</td>' +
    '</tr>';
}

function enDate(iso) {
  try {
    return new Date(iso).toLocaleDateString('fr-FR', { day:'numeric', month:'short', year:'numeric' });
  } catch (e) { return '—'; }
}
function ilYA(iso) {
  var j = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if (isNaN(j)) return '—';
  if (j <= 0) return 'aujourd’hui';
  if (j === 1) return 'hier';
  if (j < 31) return 'il y a ' + j + ' j';
  return 'il y a ' + Math.round(j / 30) + ' mois';
}

async function chargerAdieux() {
  try {
    var lignes = await window.MelodiaDB.rpc('adieux_tableau', {});
    ADIEUX = Array.isArray(lignes) ? lignes : [];

    ADIEUX = [];

  /* On ne redessine que si l'on est encore sur cette vue : l'appel peut
     revenir après que le fondateur a changé d'écran. */
  var actif = document.querySelector('.side-item.active');
  if (actif && actif.getAttribute('data-v') === 'adieux') {

function vAccueil() {
  var ca = ORDERS.reduce(function(s,o){return s+(o.price||0);},0);
  var livrees = ORDERS.filter(function(o){return o.status==='livree';}).length;
  var encours = ORDERS.filter(function(o){return o.status!=='livree';});
  var urgentes = ORDERS.filter(function(o){return o.urgence && o.status!=='livree';}).length;
  /* ─── L'ÉTAT VIDE ───
     Avant la première commande, cet écran affichait « 0 € · 0 · 0 · 0 ».
     Quatre zéros n'apprennent rien et n'indiquent rien : on ouvre sa
     console le matin, on lit quatre zéros, on referme. Tant qu'aucune
     commande n'est arrivée, la place est mieux employée à dire d'où
     viendra la première. Le bloc disparaît de lui-même dès qu'il y a
     une ligne — il n'y a rien à désactiver plus tard. */
  if (!ORDERS.length) return vPremierePas();

  var enRetard = encours.filter(estEnRetard).length;
  return '<div class="kpi-grid">' +
    /* Le chiffre de tête porte l'or. Un seul, sinon l'or ne désigne rien. */
    tuile({ phare:true, l:'Chiffre d\'affaires', v:ca, u:' €', f:'Toutes commandes' }) +
    tuile({ l:'Hommages livrés', v:livrees, f:pluriel(livrees, 'famille', 'familles'),
            etat: livrees ? 'calme' : '' }) +
    /* L'urgence cesse d'être une note de bas de tuile : elle devient
       le sujet de la tuile, et la tuile change de teinte. */
    tuile({ l:'En production', v:encours.length,
            f: enRetard ? pluriel(enRetard, 'en retard', 'en retard')
              : urgentes ? pluriel(urgentes, 'urgence', 'urgences')
              : encours.length ? 'Toutes dans les temps' : 'Rien en cours',
            etat: enRetard ? 'alerte' : urgentes ? 'attention' : encours.length ? 'calme' : '' }) +
    tuile({ l:'Partenaires', v:PARTNERS.length,
            f: PARTNERS.length ? pluriel(PARTNERS.length, 'agence', 'agences')
                               : 'Aucune inscrite',
            etat: PARTNERS.length ? 'calme' : 'attention' }) +
    '</div>' +
    '<div class="panel"><div class="panel-head"><div><div class="panel-title">À <em>traiter</em></div><div class="panel-sub">Commandes en attente d\'action</div></div>' +
    '<button class="btn btn-outline btn-sm" onclick="go(\'commandes\')">Tout voir</button></div>' +
    (encours.length ? encours.slice(0,3).map(orderCard).join('') : '<p style="color:var(--ash);">Aucune commande en attente.</p>') + '</div>' +
    '<div class="panel"><div class="panel-head"><div><div class="panel-title">Le <em>workflow</em></div><div class="panel-sub">Mode débutant — composition manuelle</div></div></div>' +
    '<div style="font-size:0.92rem; color:var(--bone); line-height:2;">' +
    '<p><b style="color:var(--or);">I.</b> La commande arrive (site ou espace partenaire) → statut <i>Reçue</i></p>' +
    '<p><b style="color:var(--or);">II.</b> Vous appelez la famille pour valider → <i>Brief validé</i></p>' +
    '<p><b style="color:var(--or);">III.</b> Atelier → paroles → « Copier le brief et ouvrir Suno » → coller le lien → <i>En composition</i></p>' +
    '<p><b style="color:var(--or);">IV.</b> Vous envoyez le fichier à la famille → <i>Livrée</i></p>' +
    '<p style="color:var(--ash); font-size:0.85rem; margin-top:0.8rem;">Chaque changement de statut est visible instantanément par le client dans son espace.</p>' +

  if (AI.style) document.getElementById('at-style-prompt').value = AI.style;
  if (AI.title) document.getElementById('at-title-h').innerHTML = '« <em>' + esc(AI.title) + '</em> »';
  if (window.MelodiaAtelier) window.MelodiaAtelier.mount();
}

async function genLyrics() {
  var defunt = document.getElementById('at-defunt').value.trim();
  var msg = document.getElementById('at-msg');
  msg.className = 'form-msg';
  if (!defunt) { msg.className = 'form-msg err'; msg.textContent = 'Le prénom est requis.'; return; }
  var btn = document.getElementById('at-btn'), st = document.getElementById('at-status');
  btn.disabled = true; btn.textContent = 'Rédaction en cours…'; st.style.display = 'inline-flex';
  var phases = ['Lecture du brief…','Écriture des couplets…','Composition du refrain…','Direction artistique…'], p = 0;
  st.textContent = phases[0];
  var t = setInterval(function(){ p = Math.min(p+1, phases.length-1); st.textContent = phases[p]; }, 1400);
  try {
    var out = await window.MelodiaAI.lyrics({
      defunt: defunt,
      traits: document.getElementById('at-traits').value.trim(),
      metier: document.getElementById('at-metier').value.trim(),
      habitude: document.getElementById('at-habitude').value.trim(),
      anecdote: document.getElementById('at-anecdote').value.trim(),
      style: document.getElementById('at-style').value
    });
    AI = { title: out.title, lyrics: out.lyrics, style: out.style_prompt };
    document.getElementById('at-lyrics').value = out.lyrics;
    document.getElementById('at-style-prompt').value = out.style_prompt;
    document.getElementById('at-title-h').innerHTML = '« <em>' + esc(out.title) + '</em> »';
  } catch (err) { msg.className = 'form-msg err'; msg.textContent = err.message; }
  clearInterval(t); st.style.display = 'none';
  btn.disabled = false; btn.textContent = 'Écrire les paroles';
}

function copyLyrics() {
  var l = document.getElementById('at-lyrics').value;
  if (navigator.clipboard) navigator.clipboard.writeText(l);
  window.melodiaToast('Paroles copiées.');
}

function vPartenaires() {
  var rows = PARTNERS.length ? PARTNERS.map(function(p){

  }).join('') : '<tr><td colspan="5" style="color:var(--ash);">Aucune agence inscrite pour le moment.</td></tr>';
  return '<div class="panel"><div class="panel-head"><div><div class="panel-title">Agences <em>partenaires</em></div><div class="panel-sub">' + PARTNERS.length + ' compte(s)</div></div></div>' +
    '<table class="tbl"><thead><tr><th>Agence</th><th>Responsable</th><th>Ville</th><th>Identifiant</th><th>Commandes</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<div class="panel"><div class="panel-title">Objectif <em>réseau</em></div><div class="panel-sub" style="margin-bottom:1.4rem;">Trajectoire commerciale</div>' +
    '<table class="tbl"><thead><tr><th>Horizon</th><th>Agences</th><th>Hommages / mois</th><th>CA mensuel</th></tr></thead><tbody>' +
    '<tr><td>Fin de trimestre</td><td>5</td><td>6</td><td>1 800 €</td></tr>' +
    '<tr><td>Fin d\'année 1</td><td>50</td><td>120</td><td>24 000 €</td></tr>' +
    '<tr><td>Fin d\'année 2</td><td>180</td><td>450</td><td>90 000 €</td></tr>' +
    '</tbody></table></div>';
}

function vFinances() {
  /* Le taux de reversement aux agences se règle dans la console :
     ce tableau le lit plutôt que de le graver à 60 %. */
  var tauxAgence = (window.MelodiaIntranet && window.MelodiaIntranet.reglages)
    ? Number(window.MelodiaIntranet.reglages.valeur('margeAgence')) : 60;
  if (!(tauxAgence >= 0 && tauxAgence <= 100)) tauxAgence = 60;
  var ca = ORDERS.reduce(function(s,o){return s+(o.price||0);},0);
  var paid = ORDERS.filter(function(o){return o.paid;}).reduce(function(s,o){return s+(o.price||0);},0);
  var duMois = ORDERS.filter(function(o){ return new Date(o.created_at).getMonth() === new Date().getMonth(); });
  var caMois = duMois.reduce(function(s,o){return s+(o.price||0);},0);
  var cout = ORDERS.length * 1;
  return '<div class="kpi-grid">' +
    '<div class="kpi"><div class="kpi-label">CA total</div><div class="kpi-value">' + ca + '<span class="u"> €</span></div><div class="kpi-foot">Toutes commandes</div></div>' +
    '<div class="kpi"><div class="kpi-label">Encaissé</div><div class="kpi-value">' + paid + '<span class="u"> €</span></div><div class="kpi-foot">Paiements confirmés</div></div>' +
    '<div class="kpi"><div class="kpi-label">CA du mois</div><div class="kpi-value">' + caMois + '<span class="u"> €</span></div><div class="kpi-foot">' + duMois.length + ' commande(s)</div></div>' +
    '<div class="kpi"><div class="kpi-label">Coût production</div><div class="kpi-value">' + cout + '<span class="u"> €</span></div><div class="kpi-foot">abonnement Suno</div></div>' +
    '</div>' +
    '<div class="panel"><div class="panel-head"><div><div class="panel-title">Détail des <em>commandes</em></div><div class="panel-sub">Base de facturation</div></div></div>' +
    '<table class="tbl"><thead><tr><th>Référence</th><th>Date</th><th>Défunt</th><th>Offre</th><th>Montant</th><th>Marge agence (' + tauxAgence + ' %)</th><th>Net maison</th></tr></thead><tbody>' +
    (ORDERS.length ? ORDERS.map(function(o){
      var agence = o.agence ? Math.round(o.price * tauxAgence / 100) : 0;
      return '<tr><td>' + esc(o.ref) + '</td><td>' + new Date(o.created_at).toLocaleDateString('fr-FR') + '</td><td>' + esc(o.defunt) + '</td><td>' + esc(o.offer) + '</td><td>' + eur(o.price) + '</td><td>' + (agence ? eur(agence) : '—') + '</td><td style="color:var(--or);">' + eur(o.price - agence) + '</td></tr>';
    }).join('') : '<tr><td colspan="7" style="color:var(--ash);">Aucune commande.</td></tr>') +
    '</tbody></table></div>' +
    '<div class="panel"><div class="panel-title">Rappel <em>fiscal</em></div><div class="panel-sub" style="margin-bottom:1.4rem;">Auto-entrepreneur</div>' +
    '<div style="font-size:0.9rem; color:var(--bone); line-height:1.9;">' +
    '<p>Cotisations URSSAF prestations de services : 21,2 % du CA encaissé.</p>' +
    '<p>Versement libératoire de l\'impôt (si opté) : 2,2 % supplémentaires.</p>' +
    '<p>TVA non applicable — article 293 B du CGI, jusqu\'à 39 100 € de CA.</p>' +
    '<p style="color:var(--ash);">Déclaration trimestrielle : provisionnez environ 25 % de chaque encaissement.</p>' +
    '</div></div>';
}

function vProspection() {
  /* Cet écran affichait trois choses inventées, restes d'une maquette :
     un entonnoir aux chiffres décoratifs (100 → 64 → 23 → 11 → 6), une
     cadence de « huit touches sur 21 jours » qui contredisait le plan
     réel de la console commerciale, et un argument d'ouverture citant
     une famille qui n'a jamais écrit. Les trois sont remplacés par ce
     qui existe vraiment : la table des prospects, PLAN.sequence, et le
     premier paragraphe du modèle « Premier contact ». */
  var V = window.MELODIA_VENTE || {};
  var seq = (V.PLAN && V.PLAN.sequence) || [];

  setTimeout(remplirEntonnoir, 0);

  return '<div class="panel" id="pro-entonnoir">' +
      '<div class="panel-head"><div><div class="panel-title">Entonnoir de <em>conversion</em></div>' +
      '<div class="panel-sub">Lecture des fiches de prospection</div></div></div>' +
      '<p class="panel-note">Chargement…</p>' +
    '</div>' +
    '<div class="grid-2">' +
    '<div class="panel"><div class="panel-title">La <em>séquence</em></div>' +
      '<div class="panel-sub" style="margin-bottom:1.4rem;">' +
        (seq.length ? seq.length + ' contacts, du premier courriel à la réactivation' : 'Plan de contact') + '</div>' +
      (seq.length
        ? '<table class="tbl"><tbody>' + seq.map(function (e) {
            return '<tr><td style="color:var(--or);white-space:nowrap;">' + esc(e.jour) + '</td>' +
              '<td><b style="color:var(--paper);">' + esc(e.action) + '</b><br>' +
              '<span style="color:var(--ash);font-size:.84rem;">' + esc(e.detail) + '</span></td></tr>';
          }).join('') + '</tbody></table>' +
          '<p class="panel-note" style="margin-top:1rem;">C\'est la séquence que suivent vos collaborateurs : ' +
          'elle est écrite une seule fois, dans leur console, et relue ici.</p>'
        : '<p class="panel-note">Le contenu commercial ne s\'est pas chargé.</p>') +
    '</div>' +
    '<div class="panel"><div class="panel-title">L\'<em>ouverture</em></div>' +
      '<div class="panel-sub" style="margin-bottom:1.4rem;">Premier paragraphe du modèle « Premier contact »</div>' +
      '<p style="font-family:var(--ff-d); font-style:italic; font-size:1.1rem; line-height:1.75; color:var(--bone);">' +
        '« Aux obsèques, la musique n\'a presque jamais connu le défunt. Un Ave Maria pour une ' +
        'grand-mère qui ne chantait qu\'en cuisine. Une valse pour un homme qui sifflait dans ses ' +
        'champs. C\'est le seul moment de la cérémonie que les familles n\'ont pas pu rendre personnel. »</p>' +
      '<p class="panel-note" style="margin-top:1.4rem;">Le courriel complet, avec l\'objet et la marge ' +
      'chiffrée, est dans la console du collaborateur — et dans le manuel de vente.</p>' +
    '</div>' +
    '</div>';
}

/* L'entonnoir, lu dans la table des prospects. Chaque étage contient
   le suivant : une fiche « partenaire » a forcément été contactée. Un
   étage qui ne serait pas un sur-ensemble du suivant donnerait un
   entonnoir qui remonte, ce qui ne veut rien dire. */
var ENTONNOIR = [
  ['Fiches au portefeuille', null],
  ['Contactées',   ['contacte', 'relance', 'interesse', 'demo_offerte', 'partenaire', 'refus']],
  ['Intéressées',  ['interesse', 'demo_offerte', 'partenaire']],
  ['Démo offerte', ['demo_offerte', 'partenaire']],
  ['Partenaires',  ['partenaire']]
];

async function remplirEntonnoir() {
  var hote = document.getElementById('pro-entonnoir');
  if (!hote) return;
  var fiches = [];
  try { fiches = (await window.MelodiaProspects.all()) || []; }
  catch (e) {
    hote.querySelector('.panel-note').textContent = 'Les fiches n\'ont pas pu être lues : ' + e.message;
    return;
  }

  var tete = '<div class="panel-head"><div><div class="panel-title">Entonnoir de <em>conversion</em></div>' +
    '<div class="panel-sub">' + fiches.length + ' fiche' + (fiches.length > 1 ? 's' : '') + ' de prospection</div></div></div>';

  if (!fiches.length) {
    /* Zéro fiche n'est pas « zéro pour cent » : c'est un entonnoir qui
       n'a pas encore commencé, et il vaut mieux le dire que dessiner
       cinq barres vides. */
    hote.innerHTML = tete +
      '<p class="panel-note">Aucune fiche de prospection pour l\'instant. ' +
      'L\'entonnoir se remplit tout seul dès que vos collaborateurs saisissent leurs premières agences.</p>';
    return;
  }

  var base = fiches.length;
  hote.innerHTML = tete + ENTONNOIR.map(function (e) {
    var n = e[1] ? fiches.filter(function (p) { return e[1].indexOf(p.statut) >= 0; }).length : base;
    var part = base ? Math.round(n / base * 100) : 0;
    return '<div style="margin-bottom:1.1rem;">' +
      '<div style="display:flex; justify-content:space-between; font-family:var(--ff-m); font-size:0.58rem; ' +
        'letter-spacing:0.16em; text-transform:uppercase; color:var(--bone); margin-bottom:0.5rem;">' +
        '<span>' + e[0] + '</span>' +
        '<span style="color:var(--or);">' + n + (e[1] ? ' · ' + part + ' %' : '') + '</span></div>' +
      '<div style="height:3px; background:var(--ink-3);">' +
        '<div style="height:100%; width:' + part + '%; background:var(--or);"></div></div></div>';
  }).join('') +
  '<p class="panel-note" style="margin-top:1.2rem;">Chiffres lus dans vos fiches, à l\'instant. ' +
  'Une fiche sans suite reste comptée comme contactée : elle l\'a été.</p>';
}

/* Le mode propriétaire vit dans son propre module : la console est trop
   fragile en concaténation de chaînes pour accueillir un éditeur complet. */
function vProprietaire() {
  return '<div id="own-root"></div>';
}

function vSysteme() {
  return '<div class="grid-2">' +
    '<div class="panel"><div class="panel-title">État du <em>système</em></div><div class="panel-sub" style="margin-bottom:1.4rem;">Configuration actuelle</div>' +
    '<table class="tbl"><tbody>' +
    '<tr><td style="color:var(--ash);">Base de données</td><td>' + (window.MelodiaDB.mode === 'supabase' ? '<span style="color:var(--green);">Supabase (production)</span>' : '<span style="color:var(--amber);">Locale (démonstration)</span>') + '</td></tr>' +
    '<tr><td style="color:var(--ash);">Rédaction des paroles</td><td><span style="color:var(--green);">Active</span></td></tr>' +
    '<tr><td style="color:var(--ash);">Composition musicale</td><td id="sys-music">Vérification…</td></tr>' +
    '<tr><td style="color:var(--ash);">Encaissement</td><td>' + etatPaiement() + '</td></tr>' +
    '<tr><td style="color:var(--ash);">Mode</td><td style="color:var(--or);">Débutant</td></tr>' +
    '</tbody></table></div>' +
    '<div class="panel"><div class="panel-title">Passer en <em>automatique</em></div><div class="panel-sub" style="margin-bottom:1.4rem;">Phase 2, quand le volume le justifiera</div>' +
    '<div style="font-size:0.9rem; color:var(--bone); line-height:1.9;">' +
    '<p><b style="color:var(--or);">I.</b> Choisir un service musical avec API (Mureka, ElevenLabs Music…)</p>' +
    '<p><b style="color:var(--or);">II.</b> Renseigner les variables sur Vercel</p>' +
    '<p><b style="color:var(--or);">III.</b> Activer la composition automatique</p>' +
    '<p style="color:var(--ash); font-size:0.85rem; margin-top:1rem;">Les fonctions serveur sont déjà écrites dans le dossier <code style="color:var(--or);">/api</code>. Tant que le volume reste inférieur à dix hommages par jour, le mode manuel garantit une qualité supérieure.</p>' +
    '</div></div>' +
    '<div class="panel" style="grid-column:1/-1;"><div class="panel-head"><div><div class="panel-title">Le <em>courriel</em></div>' +
    '<div class="panel-sub">Ce que le site sait envoyer, et ce qui manque</div></div>' +
    '<button class="btn btn-outline btn-sm" onclick="majEtatCourriel()">Revérifier</button></div>' +
    '<div id="sys-courriel">Vérification…</div></div>' +
    '<div class="panel"><div class="panel-title">Accès <em>maître</em></div><div class="panel-sub" style="margin-bottom:1.4rem;">Sécurité</div>' +
    (window.MelodiaDB.mode === 'supabase'
      ? '<p style="font-size:0.9rem; color:var(--bone); line-height:1.8;">Votre accès repose sur un compte de la base, avec un mot de passe que personne ne peut lire dans le code. Vous pouvez le changer en bas de cette page.</p>'
      : '<p style="font-size:0.9rem; color:var(--bone); line-height:1.8;">L\'identifiant maître ouvre toutes les fonctions. Il est défini dans <code style="color:var(--or);">assets/js/auth.js</code>.</p>' +
        '<p style="font-size:0.85rem; color:var(--amber); margin-top:1rem;">Avant l\'ouverture au public : changez ce mot de passe et passez en base Supabase, afin que l\'accès ne repose plus sur du code côté navigateur.</p>') + '</div>' +
    '<div class="panel"><div class="panel-title">Actions <em>rapides</em></div><div class="panel-sub" style="margin-bottom:1.4rem;">Outils</div>' +
    '<button class="btn btn-outline" style="width:100%; margin-bottom:0.8rem;" onclick="exportCSV()">Exporter les commandes (CSV)</button>' +
    '<button class="btn btn-outline" style="width:100%;" onclick="window.open(\'index.html\')">Voir le site public</button></div>' +
    '</div>' +
    /* Le mot de passe du fondateur a transité par une conversation :
       il devait être changé, et jusqu'ici cela demandait de passer par
       le tableau de bord Supabase. Il se change ici. */
    (window.MelodiaMotDePasse ? window.MelodiaMotDePasse.vue('Changer <em>mon mot de passe</em>') : '');
}

function exportCSV() {
  var head = ['Référence','Date','Défunt','Offre','Montant','Statut','Agence','Contact','Email'];
  var rows = ORDERS.map(function(o){
    return [o.ref, new Date(o.created_at).toLocaleDateString('fr-FR'), o.defunt, o.offer, o.price, (ST[o.status]||{}).label || o.status, o.agence || '', o.user_name, o.user_email]
      .map(function(v){ return '"' + String(v == null ? '' : v).replace(/"/g,'""') + '"'; }).join(';');
  });
  var csv = head.join(';') + '\n' + rows.join('\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'melodia-commandes.csv'; a.click();
  window.melodiaToast('Export CSV téléchargé.');
}

if (U) boot();
