<script>
var TITLES = { login: 'Accès à votre <em>espace</em>', signup: 'Créer votre <em>compte</em>', forgot: 'Réinitialiser le <em>mot de passe</em>' };
var POUR = {
  login: 'Les familles y retrouvent leur hommage et le suivi de leur commande. Les agences funéraires y suivent les leurs.',
  signup: 'Quelques secondes suffisent. Aucune information n\'est demandée qui ne serve au suivi de votre commande.',
  forgot: 'Nous vous envoyons un lien de réinitialisation à l\'adresse de votre compte.'
};
function showView(v) {
  ['login','signup','forgot'].forEach(function (x) { document.getElementById('view-' + x).style.display = (x === v) ? 'block' : 'none'; });
  document.getElementById('auth-title').innerHTML = TITLES[v];
  var p = document.getElementById('auth-pour');
  if (p) p.textContent = POUR[v] || '';
  /* Google ouvre une session : sur « mot de passe oublié », il n'a rien
     à faire — c'est un autre geste. */
  var g = document.getElementById('bloc-google');
  if (g && !g.dataset.absent) g.hidden = (v === 'forgot');
  msg('');
}
function msg(t, ok) {
  var m = document.getElementById('msg');
  m.className = 'form-msg' + (t ? (ok ? ' ok' : ' err') : '');
  m.textContent = t || '';
}
/* Le nom d'abord, l'identifiant ensuite : « Bienvenue Maxime » vaut
   mieux que « Bienvenue contact@melodia-funebre.fr ». */
function prenomDe(u) {
  if (!u) return '';
  var n = (u.name || u.nom || '').trim();
  if (n) return n;
  return (u.email || '').split('@')[0];
}
async function doLogin(e) {
  e.preventDefault();
  try {
    var u = await window.MelodiaAuth.login(document.getElementById('li-id').value, document.getElementById('li-pw').value);
    var vers = window.MelodiaAuth.home();
    /* La proposition d'empreinte vient APRÈS la connexion, jamais avant :
       il faut une session à retenir, et on ne demande rien à quelqu'un
       qui n'est pas encore entré. */
    await proposerEmpreinte(u);
    if (window.MelodiaAccueil) return window.MelodiaAccueil.saluer(prenomDe(u), vers);
    location.href = vers;
  } catch (err) { msg(err.message); }
  return false;
}

/* ─── Compte Google ───
   Le bouton n'est montré qu'après avoir vérifié auprès de la base que
   le fournisseur est bien activé. S'il ne l'est pas, la page n'en
   parle pas : rien de cassé, rien de promis. */
(async function preparerGoogle() {
  var bloc = document.getElementById('bloc-google');
  var bouton = document.getElementById('btn-google');
  if (!bloc || !bouton || !window.MelodiaAuth) return;
  bouton.addEventListener('click', function () {
    try {
      bouton.disabled = true;
      bouton.querySelector('span').textContent = 'Ouverture de Google…';
      window.MelodiaAuth.google();
    } catch (e) {
      bouton.disabled = false;
      bouton.querySelector('span').textContent = 'Continuer avec Google';
      msg(e.message);
    }
  });
  try {
    if (await window.MelodiaAuth.googleDisponible()) bloc.hidden = false;
    else bloc.dataset.absent = '1';
  } catch (e) { bloc.dataset.absent = '1'; }
})();

/* Au retour de Google, la session arrive dans le fragment de l'adresse.
   On la reprend avant tout le reste : inutile de montrer un formulaire
   de connexion à quelqu'un qui vient de se connecter. */
(async function retourGoogle() {
  if (!window.MelodiaAuth || !location.hash || location.hash.indexOf('access_token') === -1) {
    if (location.hash.indexOf('error') === -1) return;
  }
  try {
    var u = await window.MelodiaAuth.reprendreRetourOAuth();
    if (!u) return;
    var vers = window.MelodiaAuth.home();
    await proposerEmpreinte(u);
    if (window.MelodiaAccueil) return window.MelodiaAccueil.saluer(prenomDe(u), vers);
    location.href = vers;
  } catch (e) {
    msg('Connexion Google interrompue : ' + e.message);
  }
})();

/* ─── Empreinte ─── */
var E = window.MelodiaEmpreinte;

async function proposerEmpreinte(u) {
  if (!E || E.enrole()) return;
  try {
    if (!(await E.disponible())) return;
    /* Une seule proposition par appareil : un refus n'est pas une
       question à reposer à chaque connexion. */
    if (localStorage.getItem('melodia_empreinte_refus')) return;
    if (!confirm("Ouvrir votre tableau de bord avec votre empreinte la prochaine fois ?\n\n"
               + "Votre session sera chiffrée sur cet appareil et ne se rouvrira qu'après "
               + "vérification de votre empreinte ou de votre visage. Votre mot de passe "
               + "restera toujours possible.")) {
      try { localStorage.setItem('melodia_empreinte_refus', '1'); } catch (er) {}
      return;
    }
    await E.activer(prenomDe(u));
  } catch (err) {
    /* Un échec ici ne doit jamais empêcher d'entrer : on vient de se
       connecter, l'empreinte n'était qu'un confort. */
    msg("Empreinte non activée : " + err.message);
    await new Promise(function (r) { setTimeout(r, 2200); });
  }
}

async function ouvrirParEmpreinte() {
  msg('');
  try {
    var u = await E.ouvrir();
    var vers = window.MelodiaAuth.home();
    if (window.MelodiaAccueil) return window.MelodiaAccueil.saluer(prenomDe(u), vers);
    location.href = vers;
  } catch (err) {
    msg(err.message || "Le déverrouillage a échoué. Entrez votre mot de passe.");
  }
}

function oublierEmpreinte() {
  if (!confirm("Oublier l'empreinte enregistrée sur cet appareil ?\n\n"
             + "Vous vous connecterez de nouveau avec votre mot de passe.")) return;
  E.oublier();
  try { localStorage.removeItem('melodia_empreinte_refus'); } catch (e) {}
  document.getElementById('view-empreinte').hidden = true;
}

/* Le bloc ne s'affiche que si une clé existe ET que l'appareil sait la
   lire : un bouton qui échoue vaut moins que pas de bouton. */
(async function montrerEmpreinte() {
  if (!E || !E.enrole()) return;
  if (!(await E.disponible())) return;
  var bloc = document.getElementById('view-empreinte');
  var qui = E.qui();
  if (qui) document.getElementById('empreinte-qui').textContent = qui;
  bloc.hidden = false;
})();
async function doSignup(e) {
  e.preventDefault();
  try {
    await window.MelodiaAuth.signup({
      name: document.getElementById('su-name').value.trim(),
      email: document.getElementById('su-email').value,
      password: document.getElementById('su-pw').value,
      agence: document.getElementById('su-agence').value.trim(),
      ville: document.getElementById('su-ville').value.trim(),
      tel: document.getElementById('su-tel').value.trim()
    });
    var neuf = window.MelodiaAuth.current();
    var ou = window.MelodiaAuth.home();
    if (window.MelodiaAccueil && neuf) return window.MelodiaAccueil.saluer(prenomDe(neuf), ou);
    location.href = ou;
  } catch (err) { msg(err.message); }
  return false;
}
async function doForgot(e) {
  e.preventDefault();
  try { msg(await window.MelodiaAuth.resetPassword(document.getElementById('fg-email').value), true); }
  catch (err) { msg(err.message); }
  return false;
}
if (window.MelodiaAuth.current()) location.href = window.MelodiaAuth.home();
</script>
