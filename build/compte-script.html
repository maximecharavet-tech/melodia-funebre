<script>
var TITLES = { login: 'Accès à votre <em>espace</em>', signup: 'Créer votre <em>compte</em>', forgot: 'Réinitialiser le <em>mot de passe</em>', reset: 'Votre nouveau <em>mot de passe</em>' };
var POUR = {
  login: 'Les familles y retrouvent leur hommage et le suivi de leur commande. Les agences funéraires y suivent les leurs.',
  signup: 'Quelques secondes suffisent. Aucune information n\'est demandée qui ne serve au suivi de votre commande.',
  forgot: 'Nous vous envoyons un lien de réinitialisation à l\'adresse de votre compte.',
  reset: 'Le lien vous a identifié. Il ne reste qu\'à choisir votre nouveau mot de passe.'
};
function showView(v) {
  ['login','signup','forgot','reset'].forEach(function (x) {
    var e = document.getElementById('view-' + x);
    if (e) e.style.display = (x === v) ? 'block' : 'none';
  });
  document.getElementById('auth-title').innerHTML = TITLES[v];
  var p = document.getElementById('auth-pour');
  if (p) p.textContent = POUR[v] || '';
  /* Google ouvre une session : sur « mot de passe oublié », il n'a rien
     à faire — c'est un autre geste. */
  var g = document.getElementById('bloc-google');
  /* Google n'a rien à faire sur « mot de passe oublié » ni sur le
     choix d'un nouveau mot de passe : ce sont d'autres gestes. */
  if (g && !g.dataset.absent) g.hidden = (v === 'forgot' || v === 'reset');
  /* Sur la vue de réinitialisation, on n'offre pas de repartir vers la
     connexion : le lien n'est valable qu'une fois, et l'abandonner
     oblige à en redemander un. */
  var bascules = document.querySelectorAll('.auth-switch');
  Array.prototype.forEach.call(bascules, function (b) { b.hidden = (v === 'reset'); });
  msg('');
}
function msg(t, ok) {
  var m = document.getElementById('msg');
  m.className = 'form-msg' + (t ? (ok ? ' ok' : ' err') : '');
  m.textContent = t || '';
}
/* Le nom d'abord, l'identifiant ensuite : « Bienvenue Maxime » vaut
   mieux que « Bienvenue contact@melodia-funebre.fr ». */
function prenomDe(u) {
  if (!u) return '';
  var n = (u.name || u.nom || '').trim();
  if (n) return n;
  return (u.email || '').split('@')[0];
}
async function doLogin(e) {
  e.preventDefault();
  try {
    var u = await window.MelodiaAuth.login(document.getElementById('li-id').value, document.getElementById('li-pw').value);
    var vers = window.MelodiaAuth.home();
    /* La proposition d'empreinte vient APRÈS la connexion, jamais avant :
       il faut une session à retenir, et on ne demande rien à quelqu'un
       qui n'est pas encore entré. */
    await proposerEmpreinte(u);
    if (window.MelodiaAccueil) return window.MelodiaAccueil.saluer(prenomDe(u), vers);
    location.href = vers;
  } catch (err) { msg(err.message); }
  return false;
}

/* ─── Compte Google ───
   Le bouton n'est montré qu'après avoir vérifié auprès de la base que
   le fournisseur est bien activé. S'il ne l'est pas, la page n'en
   parle pas : rien de cassé, rien de promis. */
(async function preparerGoogle() {
  var bloc = document.getElementById('bloc-google');
  var bouton = document.getElementById('btn-google');
  if (!bloc || !bouton || !window.MelodiaAuth) return;
  bouton.addEventListener('click', function () {
    try {
      bouton.disabled = true;
      bouton.querySelector('span').textContent = 'Ouverture de Google…';
      window.MelodiaAuth.google();
    } catch (e) {
      bouton.disabled = false;
      bouton.querySelector('span').textContent = 'Continuer avec Google';
      msg(e.message);
    }
  });
  try {
    if (await window.MelodiaAuth.googleDisponible()) bloc.hidden = false;
    else bloc.dataset.absent = '1';
  } catch (e) { bloc.dataset.absent = '1'; }
})();

/* Au retour de Google, la session arrive dans le fragment de l'adresse.
   On la reprend avant tout le reste : inutile de montrer un formulaire
   de connexion à quelqu'un qui vient de se connecter. */
/* ─── Retour d'un lien de réinitialisation ───
   À traiter AVANT le retour Google : les deux arrivent avec un
   « access_token » dans le fragment, et c'est la confusion entre les
   deux qui rendait toute la réinitialisation inopérante. Le lien
   connectait la personne et l'envoyait au tableau de bord sans jamais
   lui demander de nouveau mot de passe. */
var EN_RECUPERATION = false;
(function retourRecuperation() {
  if (!window.MelodiaAuth || !window.MelodiaAuth.retourRecuperation) return;
  var r = window.MelodiaAuth.retourRecuperation();
  if (!r) return;
  if (r.erreur) {
    /* Le fragment d'erreur ne dit pas s'il vient d'un lien de
       réinitialisation ou d'un retour Google : on ne devine donc pas,
       et on écrit ce qui est vrai des deux. Il faut aussi arrêter le
       gestionnaire suivant, sinon il réécrit par-dessus « Connexion
       Google interrompue » — un message faux une fois sur deux. */
    EN_RECUPERATION = true;
    showView('forgot');
    msg('Ce lien n\'est plus valable : ' + r.erreur + '. Demandez-en un nouveau ci-dessous.');
    return;
  }
  EN_RECUPERATION = true;
  showView('reset');
})();

(async function retourGoogle() {
  if (EN_RECUPERATION) return;
  if (!window.MelodiaAuth || !location.hash || location.hash.indexOf('access_token') === -1) {
    if (location.hash.indexOf('error') === -1) return;
  }
  try {
    var u = await window.MelodiaAuth.reprendreRetourOAuth();
    if (!u) return;
    var vers = window.MelodiaAuth.home();
    await proposerEmpreinte(u);
    if (window.MelodiaAccueil) return window.MelodiaAccueil.saluer(prenomDe(u), vers);
    location.href = vers;
  } catch (e) {
    msg('Connexion Google interrompue : ' + e.message);
  }
})();

/* ─── Empreinte ─── */
var E = window.MelodiaEmpreinte;

/* ─── Proposer l'ouverture rapide ───
   C'était une boîte « confirm() » du navigateur : un pavé système
   surgi au milieu d'une connexion, dans une langue et une forme qui
   n'ont rien à voir avec la page. Beaucoup de gens y répondent non par
   réflexe. L'invitation est maintenant dans la page, avec ce qu'elle
   engage écrit en clair, et deux boutons de taille normale.

   Elle ne s'affiche qu'une fois par appareil : un refus n'est pas une
   question à reposer à chaque connexion. */
function proposerEmpreinte(u) {
  return new Promise(function (fini) {
    if (!E) return fini();
    if (E.enrole()) return fini();
    var refus = null;
    try { refus = localStorage.getItem('melodia_empreinte_refus'); } catch (e) {}
    if (refus) return fini();

    E.disponible().then(function (dispo) {
      if (!dispo) return fini();

      var carte = document.getElementById('view-proposition');
      var oui = document.getElementById('emp-oui');
      var non = document.getElementById('emp-non');
      var etat = document.getElementById('emp-etat');
      if (!carte || !oui || !non) return fini();

      ['view-login', 'view-signup', 'view-forgot', 'view-empreinte', 'bloc-google'].forEach(function (id) {
        var e = document.getElementById(id);
        if (e) { e.style.display = 'none'; e.hidden = true; }
      });
      carte.hidden = false;
      document.getElementById('auth-title').innerHTML = 'Ouvrir plus vite la <em>prochaine fois</em>';
      var p = document.getElementById('auth-pour');
      if (p) p.textContent = 'Vous êtes connecté. Reste une question, une seule.';

      non.addEventListener('click', function () {
        try { localStorage.setItem('melodia_empreinte_refus', '1'); } catch (e) {}
        fini();
      });
      oui.addEventListener('click', async function () {
        oui.disabled = true; non.disabled = true;
        oui.textContent = 'Suivez votre appareil…';
        try {
          await E.activer(prenomDe(u));
          etat.className = 'form-msg ok';
          etat.textContent = 'C\'est fait. Un doigt suffira désormais.';
          setTimeout(fini, 1100);
        } catch (err) {
          etat.className = 'form-msg err';
          etat.textContent = err.message + ' Vous entrerez votre mot de passe comme avant.';
          oui.disabled = false; non.disabled = false;
          oui.textContent = 'Activer';
          setTimeout(fini, 2600);
        }
      });
    }, fini);
  });
}

async function ouvrirParEmpreinte() {
  msg('');
  try {
    var u = await E.ouvrir();
    var vers = window.MelodiaAuth.home();
    if (window.MelodiaAccueil) return window.MelodiaAccueil.saluer(prenomDe(u), vers);
    location.href = vers;
  } catch (err) {
    msg(err.message || "Le déverrouillage a échoué. Entrez votre mot de passe.");
  }
}

function oublierEmpreinte() {
  if (!confirm("Oublier l'empreinte enregistrée sur cet appareil ?\n\n"
             + "Vous vous connecterez de nouveau avec votre mot de passe.")) return;
  E.oublier();
  try { localStorage.removeItem('melodia_empreinte_refus'); } catch (e) {}
  document.getElementById('view-empreinte').hidden = true;
}

/* Le bloc ne s'affiche que si une clé existe ET que l'appareil sait la
   lire : un bouton qui échoue vaut moins que pas de bouton. */
(async function montrerEmpreinte() {
  if (!E || !E.enrole()) return;
  if (!(await E.disponible())) return;
  var bloc = document.getElementById('view-empreinte');
  var qui = E.qui();
  if (qui) document.getElementById('empreinte-qui').textContent = qui;
  bloc.hidden = false;
})();
async function doSignup(e) {
  e.preventDefault();
  try {
    await window.MelodiaAuth.signup({
      name: document.getElementById('su-name').value.trim(),
      email: document.getElementById('su-email').value,
      password: document.getElementById('su-pw').value,
      agence: document.getElementById('su-agence').value.trim(),
      ville: document.getElementById('su-ville').value.trim(),
      tel: document.getElementById('su-tel').value.trim()
    });
    var neuf = window.MelodiaAuth.current();
    var ou = window.MelodiaAuth.home();
    if (window.MelodiaAccueil && neuf) return window.MelodiaAccueil.saluer(prenomDe(neuf), ou);
    location.href = ou;
  } catch (err) { msg(err.message); }
  return false;
}
async function doForgot(e) {
  e.preventDefault();
  try { msg(await window.MelodiaAuth.resetPassword(document.getElementById('fg-email').value), true); }
  catch (err) { msg(err.message); }
  return false;
}

/* ─── Poser le nouveau mot de passe ─── */
function forceMot(v) {
  var n = 0;
  if (v.length >= 8) n++;
  if (v.length >= 14) n++;
  if (/[0-9]/.test(v) && /[a-zA-Z]/.test(v)) n++;
  if (/[^a-zA-Z0-9]/.test(v)) n++;
  return n;
}
(function jaugeReset() {
  var champ = document.getElementById('rs-pw');
  var jauge = document.getElementById('rs-force');
  var voir = document.getElementById('rs-voir');
  if (!champ || !jauge) return;
  var mots = ['Trop court', 'Faible', 'Correct', 'Solide', 'Excellent'];
  var teintes = ['var(--red)', 'var(--red)', 'var(--amber)', 'var(--green)', 'var(--green)'];
  champ.addEventListener('input', function () {
    var v = champ.value;
    if (!v) { jauge.firstChild.style.width = '0'; jauge.dataset.mot = ''; return; }
    var n = forceMot(v);
    jauge.firstChild.style.width = (25 * Math.max(n, 1)) + '%';
    jauge.firstChild.style.background = teintes[n];
    jauge.dataset.mot = mots[n];
  });
  if (voir) voir.addEventListener('click', function () {
    var cache = champ.type === 'password';
    champ.type = cache ? 'text' : 'password';
    document.getElementById('rs-pw2').type = cache ? 'text' : 'password';
    voir.textContent = cache ? 'Masquer' : 'Afficher';
  });
})();

async function doReset(e) {
  e.preventDefault();
  var pw = document.getElementById('rs-pw').value;
  var pw2 = document.getElementById('rs-pw2').value;
  if (pw !== pw2) return msg('Les deux mots de passe ne sont pas identiques.');
  if (pw.length < 8) return msg('Huit caractères minimum : ce compte ouvre des données de familles.');
  var b = e.target.querySelector('button[type=submit]');
  b.disabled = true; b.textContent = 'Enregistrement…';
  try {
    msg(await window.MelodiaAuth.changerMotDePasse(pw), true);
    /* Le nouveau mot de passe est actif : la session ouverte par le
       lien devient une session normale, on relit le rôle et on mène
       la personne à son espace plutôt que de la faire ressaisir. */
    await window.MelodiaAuth.relireRole();
    setTimeout(function () { location.href = window.MelodiaAuth.home(); }, 1400);
  } catch (err) {
    b.disabled = false; b.textContent = 'Enregistrer mon nouveau mot de passe';
    msg(err.message);
  }
  return false;
}
if (window.MelodiaAuth.current()) location.href = window.MelodiaAuth.home();
</script>
