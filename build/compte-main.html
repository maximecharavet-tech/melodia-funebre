

  <section class="section page-auth">
    <div class="wrap auth-wrap">
      <div class="center reveal in" style="margin-bottom:2.6rem;">
        <img src="assets/img/logo-melodia.jpg" alt="Melodia Funèbre" class="auth-logo">
        <div class="eyebrow">Espace partenaire</div>
        <h1 class="h-lg" id="auth-title">Accès à votre <em>tableau de bord</em></h1>
      </div>

      <div class="card reveal in reveal-d1">
        <div id="msg" class="form-msg"></div>

        <!-- CONNEXION -->
        <form id="view-login" onsubmit="return doLogin(event)">
          <div class="field">
            <label class="field-label" for="li-id">Identifiant ou email</label>
            <input class="field-input" id="li-id" autocomplete="username" placeholder="vous@agence.fr">
          </div>
          <div class="field">
            <label class="field-label" for="li-pw">Mot de passe</label>
            <input class="field-input" id="li-pw" type="password" autocomplete="current-password" placeholder="••••••••">
          </div>
          <button class="btn btn-gold btn-block" type="submit">Se connecter</button>
          <div class="auth-switch">
            <button type="button" class="lien-bascule" onclick="showView('forgot')">Mot de passe oublié</button>
            <button type="button" class="lien-bascule lien-bascule-or" onclick="showView('signup')">Créer un compte</button>
          </div>
        </form>

        <!-- CRÉATION DE COMPTE -->
        <form id="view-signup" style="display:none;" onsubmit="return doSignup(event)">
          <div class="field">
            <label class="field-label" for="su-agence">Nom de l'agence *</label>
            <input class="field-input" id="su-agence" placeholder="Pompes Funèbres …">
          </div>
          <div class="field-row">
            <div class="field">
              <label class="field-label" for="su-name">Votre nom *</label>
              <input class="field-input" id="su-name" placeholder="Prénom Nom">
            </div>
            <div class="field">
              <label class="field-label" for="su-ville">Ville</label>
              <input class="field-input" id="su-ville" placeholder="Lyon">
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label class="field-label" for="su-email">Email *</label>
              <input class="field-input" id="su-email" type="email" autocomplete="email" placeholder="vous@agence.fr">
            </div>
            <div class="field">
              <label class="field-label" for="su-tel">Téléphone</label>
              <input class="field-input" id="su-tel" type="tel" placeholder="06 …">
            </div>
          </div>
          <div class="field">
            <label class="field-label" for="su-pw">Mot de passe *</label>
            <input class="field-input" id="su-pw" type="password" autocomplete="new-password" placeholder="6 caractères minimum">
            <div class="field-hint">Il vous servira d'accès à votre tableau de bord partenaire.</div>
          </div>
          <button class="btn btn-gold btn-block" type="submit">Créer mon compte</button>
          <div class="auth-switch auth-switch-solo">
            <button type="button" class="lien-bascule" onclick="showView('login')">← J'ai déjà un compte</button>
          </div>
        </form>

        <!-- MOT DE PASSE OUBLIÉ -->
        <form id="view-forgot" style="display:none;" onsubmit="return doForgot(event)">
          <p class="auth-intro">Renseignez l'email de votre compte : nous vous envoyons un lien de réinitialisation.</p>
          <div class="field">
            <label class="field-label" for="fg-email">Email du compte</label>
            <input class="field-input" id="fg-email" type="email" placeholder="vous@agence.fr">
          </div>
          <button class="btn btn-gold btn-block" type="submit">Réinitialiser mon mot de passe</button>
          <div class="auth-switch auth-switch-solo">
            <button type="button" class="lien-bascule" onclick="showView('login')">← Retour à la connexion</button>
          </div>
        </form>
      </div>

      <p class="center auth-note">
        Accès réservé aux partenaires et à la direction
      </p>
    </div>
  </section>
