

  <section class="section" style="padding-top:9rem; min-height:100vh;">
    <div class="wrap" style="max-width:520px;">
      <div class="center reveal in" style="margin-bottom:2.6rem;">
        <img src="assets/img/logo-melodia.jpg" alt="Melodia Funèbre" style="height:110px; margin:0 auto 1.8rem;">
        <div class="eyebrow">Espace partenaire</div>
        <h1 class="h-lg" id="auth-title">Accès à votre <em>tableau de bord</em></h1>
      </div>

      <div class="card reveal in reveal-d1">
        <div id="msg" class="form-msg"></div>

        <!-- CONNEXION -->
        <form id="view-login" onsubmit="return doLogin(event)">
          <div class="field">
            <label class="field-label" for="li-id">Identifiant ou email</label>
            <input class="field-input" id="li-id" autocomplete="username" placeholder="vous@agence.fr">
          </div>
          <div class="field">
            <label class="field-label" for="li-pw">Mot de passe</label>
            <input class="field-input" id="li-pw" type="password" autocomplete="current-password" placeholder="••••••••">
          </div>
          <button class="btn btn-gold" style="width:100%;" type="submit">Se connecter</button>
          <div style="display:flex; justify-content:space-between; gap:1rem; margin-top:1.6rem; flex-wrap:wrap;">
            <button type="button" onclick="showView('forgot')" style="font-family:var(--ff-m); font-size:0.58rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--ash);">Mot de passe oublié</button>
            <button type="button" onclick="showView('signup')" style="font-family:var(--ff-m); font-size:0.58rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--or);">Créer un compte</button>
          </div>
        </form>

        <!-- CRÉATION DE COMPTE -->
        <form id="view-signup" style="display:none;" onsubmit="return doSignup(event)">
          <div class="field">
            <label class="field-label" for="su-agence">Nom de l'agence *</label>
            <input class="field-input" id="su-agence" placeholder="Pompes Funèbres …">
          </div>
          <div class="field-row">
            <div class="field">
              <label class="field-label" for="su-name">Votre nom *</label>
              <input class="field-input" id="su-name" placeholder="Prénom Nom">
            </div>
            <div class="field">
              <label class="field-label" for="su-ville">Ville</label>
              <input class="field-input" id="su-ville" placeholder="Lyon">
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label class="field-label" for="su-email">Email *</label>
              <input class="field-input" id="su-email" type="email" autocomplete="email" placeholder="vous@agence.fr">
            </div>
            <div class="field">
              <label class="field-label" for="su-tel">Téléphone</label>
              <input class="field-input" id="su-tel" type="tel" placeholder="06 …">
            </div>
          </div>
          <div class="field">
            <label class="field-label" for="su-pw">Mot de passe *</label>
            <input class="field-input" id="su-pw" type="password" autocomplete="new-password" placeholder="6 caractères minimum">
            <div class="field-hint">Il vous servira d'accès à votre tableau de bord partenaire.</div>
          </div>
          <button class="btn btn-gold" style="width:100%;" type="submit">Créer mon compte</button>
          <div style="margin-top:1.6rem; text-align:center;">
            <button type="button" onclick="showView('login')" style="font-family:var(--ff-m); font-size:0.58rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--ash);">← J'ai déjà un compte</button>
          </div>
        </form>

        <!-- MOT DE PASSE OUBLIÉ -->
        <form id="view-forgot" style="display:none;" onsubmit="return doForgot(event)">
          <p style="color:var(--ash); font-size:0.9rem; margin-bottom:1.6rem;">Renseignez l'email de votre compte : nous vous envoyons un lien de réinitialisation.</p>
          <div class="field">
            <label class="field-label" for="fg-email">Email du compte</label>
            <input class="field-input" id="fg-email" type="email" placeholder="vous@agence.fr">
          </div>
          <button class="btn btn-gold" style="width:100%;" type="submit">Réinitialiser mon mot de passe</button>
          <div style="margin-top:1.6rem; text-align:center;">
            <button type="button" onclick="showView('login')" style="font-family:var(--ff-m); font-size:0.58rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--ash);">← Retour à la connexion</button>
          </div>
        </form>
      </div>

      <p class="center" style="font-family:var(--ff-m); font-size:0.52rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--dust); margin-top:2rem;">
        Accès réservé aux partenaires et à la direction
      </p>
    </div>
  </section>
