[package]
name = "melodia-pro-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Melodia Funèbre Pro — logique pure (QR, prix, promo, questionnaire, prompt, statut, essai, SIRET) compilée en WebAssembly."
license = "UNLICENSED"

[lib]
name = "melodia_pro"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"
# MIT OR Apache-2.0 — encodeur QR, sans les fonctionnalités image/svg (nous dessinons nous-mêmes)
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
# MIT OR Apache-2.0 — décodeur QR, sert uniquement à prouver que chaque style se lit
rqrr = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
