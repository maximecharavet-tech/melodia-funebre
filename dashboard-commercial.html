<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Console commerciale — Melodia Funèbre</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=bafe7843">
<link rel="stylesheet" href="assets/css/dashboard.css?v=4243bdaa">
</head>
<body>
<div class="dash">
  <aside class="side" id="side">
    <a href="index.html" class="side-brand">
      <img src="assets/img/logo-melodia.jpg?v=c9f03ed0" alt="">
      <span><span class="n">Melodia</span><span class="s">Console commerciale</span></span>
    </a>
    <div class="side-label">Prospection</div>
    <button class="side-item active" data-v="accueil"><span class="ico">◈</span>Tableau de bord</button>
    <button class="side-item" data-v="relances"><span class="ico">⏱</span>À faire<span class="side-badge" id="badge-rel" style="display:none;">0</span></button>
    <button class="side-item" data-v="recherche"><span class="ico">◎</span>Rechercher</button>
    <button class="side-item" data-v="prospects"><span class="ico">♪</span>Mes prospects<span class="side-badge" id="badge-pro">0</span></button>
    <div class="side-label">Ma boîte à outils</div>
    <button class="side-item" data-v="playbook"><span class="ico">◈</span>Script et objections</button>
    <button class="side-item" data-v="modeles"><span class="ico">✎</span>Modèles de courriel</button>
    <button class="side-item" data-v="plan"><span class="ico">◇</span>Plan de prospection</button>
    <button class="side-item" data-v="traditions"><span class="ico">✧</span>Les traditions</button>
    <div class="side-foot">
      <div class="side-user">
        <div class="side-avatar" id="u-initial">—</div>
        <div style="min-width:0;">
          <div class="side-uname" id="u-name">—</div>
          <div class="side-urole" id="u-role">Collaborateur</div>
        </div>
      </div>
      <button class="btn btn-outline btn-sm" style="width:100%; margin-top:0.8rem;" onclick="logout()">Déconnexion</button>
    </div>
  </aside>

  <main class="dash-main">
    <div class="dash-top">
      <div style="display:flex; gap:1rem; align-items:flex-start;">
        <button class="dash-burger" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
        <div>
          <div class="dash-eyebrow" id="head-eyebrow">Prospection</div>
          <h1 class="dash-title" id="head-title">Tableau de <em>bord</em></h1>
        </div>
      </div>
      <div class="pill" id="mode-badge">—</div>
    </div>
    <div id="view"></div>
  </main>
</div>

<script src="assets/js/config.js?v=13072ce7"></script>
<script src="assets/js/auth.js?v=6ff8a2e5"></script>
<script src="assets/js/main.js?v=efc900f7"></script>
<script src="assets/js/commercial-contenu.js?v=3593a3cb"></script>
<script src="assets/js/commercial.js?v=adf8520d"></script>
</body>
</html>
