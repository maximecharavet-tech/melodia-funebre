name: Validate & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validation du site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la structure des fichiers
        run: node scripts/check.js

      - name: Vérifier le HTML (balises équilibrées)
        run: |
          python3 - <<'PY'
          import glob, sys
          files = sorted(glob.glob('*.html'))
          if not files:
              sys.exit('Aucun fichier HTML trouvé')
          bad = 0
          for f in files:
              c = open(f, encoding='utf-8').read()
              errs = []
              if c.count('<!DOCTYPE') != 1: errs.append('DOCTYPE')
              if c.count('</html>') != 1: errs.append('html close')
              if c.count('<body') != c.count('</body>'): errs.append('body')
              if errs:
                  bad += 1
                  print(f'✗ {f}: ' + ', '.join(errs))
              else:
                  print(f'✓ {f}')
          sys.exit(1 if bad else 0)
          PY

  deploy:
    name: Déploiement Vercel
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Déployer sur Vercel (production)
        run: |
          npm i -g vercel
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
