<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 520" width="240" height="520"
     fill="none" aria-hidden="true">
  <!-- Rameau de laurier : la tige monte, les feuilles s'ouvrent en
       alternance et rapetissent vers la pointe. Dessiné plutôt que
       photographié — il se teinte avec l'or de la charte, reste net
       sur tout écran et pèse deux kilo-octets. -->
  <defs>
    <linearGradient id="or-rameau" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0"    stop-color="#6b5828"/>
      <stop offset="0.42" stop-color="#c9a84c"/>
      <stop offset="0.68" stop-color="#e3c977"/>
      <stop offset="1"    stop-color="#8a712f"/>
    </linearGradient>
  </defs>
  <g stroke="url(#or-rameau)" stroke-linecap="round">
    <!-- Tige -->
    <path d="M34 512 C 60 430, 82 344, 104 258 S 150 96, 178 14"
          stroke-width="2.4" opacity=".95"/>
    <!-- Vrille -->
    <path d="M104 258 C 128 236, 140 210, 132 186" stroke-width="1.1" opacity=".55"/>
  </g>
  <g fill="url(#or-rameau)">
    <!-- Feuilles à droite de la tige -->
    <ellipse cx="78"  cy="470" rx="46" ry="15" opacity=".92" transform="rotate(-28 78 470)"/>
    <ellipse cx="96"  cy="404" rx="43" ry="14" opacity=".88" transform="rotate(-24 96 404)"/>
    <ellipse cx="112" cy="340" rx="40" ry="13" opacity=".84" transform="rotate(-21 112 340)"/>
    <ellipse cx="130" cy="278" rx="36" ry="12" opacity=".80" transform="rotate(-18 130 278)"/>
    <ellipse cx="148" cy="218" rx="31" ry="10" opacity=".74" transform="rotate(-15 148 218)"/>
    <ellipse cx="166" cy="160" rx="26" ry="9"  opacity=".66" transform="rotate(-12 166 160)"/>
    <ellipse cx="182" cy="106" rx="20" ry="7"  opacity=".56" transform="rotate(-9 182 106)"/>
    <ellipse cx="194" cy="60"  rx="14" ry="5"  opacity=".44" transform="rotate(-6 194 60)"/>
    <!-- Feuilles à gauche, plus courtes : le rameau reste lisible -->
    <ellipse cx="14"  cy="446" rx="33" ry="11" opacity=".70" transform="rotate(34 14 446)"/>
    <ellipse cx="34"  cy="378" rx="31" ry="10" opacity=".66" transform="rotate(31 34 378)"/>
    <ellipse cx="52"  cy="312" rx="28" ry="10" opacity=".60" transform="rotate(28 52 312)"/>
    <ellipse cx="72"  cy="250" rx="25" ry="9"  opacity=".54" transform="rotate(25 72 250)"/>
    <ellipse cx="92"  cy="192" rx="21" ry="8"  opacity=".46" transform="rotate(22 92 192)"/>
    <ellipse cx="112" cy="138" rx="17" ry="6"  opacity=".38" transform="rotate(19 112 138)"/>
    <!-- Bouton de laurier, à la naissance de la vrille -->
    <ellipse cx="132" cy="182" rx="8" ry="12" opacity=".72" transform="rotate(14 132 182)"/>
    <!-- Éclats : la poussière d'or de la charte -->
    <circle cx="150" cy="330" r="2.6" opacity=".55"/>
    <circle cx="188" cy="242" r="2"   opacity=".45"/>
    <circle cx="64"  cy="352" r="1.8" opacity=".40"/>
    <circle cx="206" cy="132" r="1.6" opacity=".35"/>
    <circle cx="118" cy="420" r="2.2" opacity=".48"/>
  </g>
</svg>
