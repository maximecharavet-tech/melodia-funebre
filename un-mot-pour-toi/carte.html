<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15191d" media="(prefers-color-scheme: dark)">
<title>La carte</title>
<!-- La carte de quelqu'un, pour quelqu'un. Elle n'a rien à faire dans
     un moteur de recherche, et son adresse ne doit pas fuir par le
     référent quand on clique un lien depuis la page. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%232f5580'/%3E%3Cpath d='M9 11h14M9 16h14M9 21h8' stroke='%23f4f1ea' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Public+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/un-mot-pour-toi/assets/style.css">
</head>
<body>
<main class="enveloppe enveloppe-large">

  <header class="entete" id="entete">
    <p class="sur-titre" id="sur-titre">La carte</p>
    <h1 id="titre">Tous les mots de l&rsquo;équipe.</h1>
    <p class="chapeau" id="chapeau">Un instant, on va les chercher…</p>
  </header>

  <figure class="affiche" id="affiche" hidden>
    <img id="affiche-image" alt="" decoding="async">
  </figure>

  <div id="messages">
    <div class="lettre">
      <div class="squelette" style="width:45%;height:1.6rem;"></div>
      <div class="squelette" style="width:92%;"></div>
      <div class="squelette" style="width:78%;"></div>
    </div>
  </div>

  <noscript>
    <p class="le-mot">Cette carte a besoin de JavaScript pour s&rsquo;afficher.
    Activez-le, ou ouvrez ce lien dans un autre navigateur.</p>
  </noscript>

  <p class="pied" id="pied"></p>

</main>

<script src="/un-mot-pour-toi/assets/config.js"></script>
<script src="/un-mot-pour-toi/assets/carte.js"></script>
</body>
</html>
