<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15191d" media="(prefers-color-scheme: dark)">
<title>Un mot pour toi</title>
<!-- Le message de quelqu'un pour quelqu'un. Il n'a rien à faire dans
     un moteur de recherche, et l'adresse ne doit pas fuir par le
     référent quand on clique un lien depuis la page. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%232f5580'/%3E%3Cpath d='M9 11h14M9 16h14M9 21h8' stroke='%23f4f1ea' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Public+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/un-mot-pour-toi/assets/style.css">
</head>
<body>
<main class="enveloppe">

  <!-- Ce que voit un lecteur sans JavaScript, et ce que voit tout le
       monde pendant la fraction de seconde où le message arrive. -->
  <article class="lettre" id="lettre">
    <p class="de-la-part">Un mot pour toi</p>
    <div id="squelette">
      <div class="squelette" style="width:55%;height:1.8rem;"></div>
      <div class="squelette" style="width:92%;"></div>
      <div class="squelette" style="width:86%;"></div>
      <div class="squelette" style="width:64%;"></div>
    </div>
    <noscript>
      <p class="le-mot">Ce message a besoin de JavaScript pour s&rsquo;afficher.
      Activez-le, ou ouvrez ce lien dans un autre navigateur.</p>
    </noscript>
  </article>

  <p class="pied" id="pied"></p>

</main>

<script src="/un-mot-pour-toi/assets/config.js"></script>
<script src="/un-mot-pour-toi/assets/lire.js"></script>
</body>
</html>
